# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 7d72d720-5c8e-4eac-809a-31a4c3517d13

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    #mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-3e1f0078-9d00.cloud.databricks.com
    variables:
      catalog: dev_bakehouse
      schema: RND_Purpose   #we created it for our purpose
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-3e1f0078-9d00.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gdebjani19@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gdebjani19@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_bakehouse
      schema: RND_Purpose #added comment
    permissions:
      - user_name: gdebjani19@gmail.com
        level: CAN_MANAGE
